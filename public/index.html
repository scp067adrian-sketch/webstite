<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Products</title>
    <style>
        :root {
            --bg-color: #0b020d;
            --sidebar-bg: #130417;
            --card-bg: #18051e;
            --accent-purple: #ff007f;
            --text-main: #ffffff;
            --text-muted: #b892c9;
            --border-color: #3b0e46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
        }

        /* Mouse Glow & Cursor */
        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.12) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
        }
        .cursor {
            position: fixed; top: 0; left: 0; width: 14px; height: 14px;
            background-color: var(--accent-purple); border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--accent-purple); z-index: 9999;
        }

        header, .main-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 50px; border-bottom: 1px solid var(--border-color); 
            background: rgba(11, 2, 13, 0.9); backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.3rem; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 32px; height: 32px; object-fit: contain; }

        .main-layout {
            max-width: 1300px; margin: 40px auto; padding: 0 30px; flex: 1; width: 100%;
        }

        footer {
            border-top: 1px solid var(--border-color); padding: 30px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(11, 2, 13, 0.9); font-size: 0.85rem; color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor"></div>

    <!-- Header without nav links -->
    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
        </a>
    </header>

    <div class="main-layout">
        <h1 style="margin-bottom: 20px;">Products</h1>
        <!-- Your products grid / content goes here -->
    </div>

    <!-- Footer without policy links -->
    <footer>
        <div>TVM</div>
        <div>Copyright © TVM 2026</div>
    </footer>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });
    </script>
</body>
</html>
