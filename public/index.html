<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Products</title>
    <style>
        :root {
            --bg-color: #07010a;
            --card-bg: rgba(24, 5, 30, 0.6);
            --accent-purple: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.25);
            --text-main: #ffffff;
            --text-muted: #b892c9;
            --border-color: rgba(255, 0, 127, 0.2);
            --border-hover: rgba(255, 0, 127, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(100, 0, 80, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
        }

        /* Mouse Glow & Cursor */
        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
            transition: width 0.3s, height 0.3s;
        }
        .cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            background-color: var(--accent-purple); border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--accent-purple); z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor.hovered {
            transform: translate(-50%, -50%) scale(2);
            background-color: rgba(255, 0, 127, 0.4);
            border: 1px solid var(--accent-purple);
        }

        header, .main-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 25px 60px; border-bottom: 1px solid var(--border-color); 
            background: rgba(7, 1, 10, 0.85); backdrop-filter: blur(15px);
        }
        .logo-area { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 1.5rem; letter-spacing: 1.5px; color: var(--text-main); text-decoration: none; text-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .logo-icon { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 8px var(--accent-purple)); }

        .main-layout {
            max-width: 1300px; margin: 50px auto; padding: 0 30px; flex: 1; width: 100%;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .product-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        .product-title { 
            padding: 24px 20px 16px 20px; 
            font-size: 1.3rem; 
            font-weight: 800; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            background: rgba(255, 0, 127, 0.03);
        }

        .product-body { 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            flex-grow: 1; 
            justify-content: space-between; 
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .meta-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .product-price { 
            font-weight: 900; 
            font-size: 1.4rem; 
            color: #fff;
        }

        .stock-badge {
            font-size: 0.8rem;
            color: var(--accent-purple);
            background: rgba(255, 0, 127, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.2);
            font-weight: 600;
        }

        .view-btn {
            display: block; 
            width: 100%; 
            text-align: center; 
            background: linear-gradient(135deg, var(--accent-purple), #b30059);
            color: #fff; 
            padding: 12px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: all 0.2s ease;
        }

        .view-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        footer {
            border-top: 1px solid var(--border-color); 
            padding: 30px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(7, 1, 10, 0.9); font-size: 0.85rem; color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
        </a>
    </header>

    <div class="main-layout">
        <h1 class="page-title">Explore Products</h1>
        <div class="products-grid" id="productsGrid">
            <!-- Dynamic products load here -->
        </div>
    </div>

    <footer>
        <div>TVM</div>
        <div>Copyright © TVM 2026</div>
    </footer>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        // Hover effect for interactive elements
        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.add('hovered');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.remove('hovered');
            }
        });

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-title">${p.name}</div>
                        <div class="product-body">
                            <p class="product-desc">${p.description}</p>
                            <div>
                                <div class="meta-row" style="margin-bottom: 15px;">
                                    <span class="product-price">$${p.price.toFixed(2)}</span>
                                    <span class="stock-badge">${p.stock} In Stock</span>
                                </div>
                                <a href="/product.html?id=${p.id}" class="view-btn">View Details →</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load products", err);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
