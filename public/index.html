<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Products</title>
    <style>
        :root {
            --bg-color: #050008;
            --card-bg: rgba(20, 4, 28, 0.75);
            --accent-purple: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-muted: #c49edc;
            --border-color: rgba(255, 0, 127, 0.3);
            --border-hover: rgba(255, 0, 127, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Mesh Background with Cyber Grid Overlay */
        .bg-ambient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(120, 0, 90, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 100, 0.2) 0%, transparent 70%),
                linear-gradient(135deg, #050008 0%, #12021a 50%, #050008 100%);
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image: 
                linear-gradient(rgba(255, 0, 127, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 127, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at 50% 40%, black 40%, transparent 90%);
        }

        /* Mouse Glow & Heart Cursor */
        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
        }
        .cursor {
            position: fixed; top: 0; left: 0; font-size: 20px;
            pointer-events: none; transform: translate(-50%, -50%);
            text-shadow: 0 0 10px var(--accent-purple), 0 0 20px rgba(255, 0, 127, 0.8);
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor.hovered {
            transform: translate(-50%, -50%) scale(1.6);
        }

        /* 3D Raining Hearts Animation Layer */
        .hearts-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 3; overflow: hidden; 
        }
        .heart { 
            position: absolute; 
            font-size: 24px; 
            animation: floatUp linear infinite; 
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 0 0 30px rgba(255, 0, 127, 0.4);
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6));
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.7) rotate(0deg); opacity: 0; }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; }
            100% { transform: translateY(-12vh) scale(1.4) rotate(360deg); opacity: 0; }
        }

        header, .main-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 25px 60px; border-bottom: 1px solid var(--border-color); 
            background: rgba(10, 1, 16, 0.75); backdrop-filter: blur(20px);
        }
        .logo-area { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 1.5rem; letter-spacing: 1.5px; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 10px var(--accent-purple)); }

        .main-layout {
            max-width: 1400px; margin: 50px auto; padding: 0 40px; flex: 1; width: 100%;
        }

        .page-title {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,0,127,0.3);
        }

        /* Bigger Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 40px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }
        
        .product-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-6px);
            box-shadow: 0 20px 50px var(--accent-glow);
        }

        .product-title { 
            padding: 28px 24px; 
            font-size: 1.6rem; 
            font-weight: 800; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            background: rgba(255, 0, 127, 0.06);
            letter-spacing: 0.5px;
        }

        .product-body { 
            padding: 32px; 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
            flex-grow: 1; 
            justify-content: space-between; 
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .meta-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .product-price { 
            font-weight: 900; 
            font-size: 1.8rem; 
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .stock-badge {
            font-size: 0.95rem;
            color: var(--accent-purple);
            background: rgba(255, 0, 127, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            font-weight: 700;
        }

        .view-btn {
            display: block; 
            width: 100%; 
            text-align: center; 
            background: linear-gradient(135deg, var(--accent-purple), #b30059);
            color: #fff; 
            padding: 16px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
        }

        .view-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 8px 30px rgba(255, 0, 127, 0.65);
        }

        footer {
            border-top: 1px solid var(--border-color); 
            padding: 30px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 1, 16, 0.85); font-size: 0.85rem; color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor">💖</div>
    <div class="hearts-container" id="heartsContainer"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
        </a>
    </header>

    <div class="main-layout">
        <h1 class="page-title">Explore Products</h1>
        <div class="products-grid" id="productsGrid">
            <!-- Dynamic products load here -->
        </div>
    </div>

    <footer>
        <div>TVM</div>
        <div>Copyright © TVM 2026</div>
    </footer>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        // Vibrant 3D Raining Hearts Generator
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💜', '✨', '🩷'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = duration + 's';
            
            const size = Math.random() * 18 + 18;
            heart.style.fontSize = size + 'px';
            heart.style.opacity = Math.random() * 0.4 + 0.6;

            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 250);

        // Hover effect for interactive elements
        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.add('hovered');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.remove('hovered');
            }
        });

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-title">${p.name}</div>
                        <div class="product-body">
                            <p class="product-desc">${p.description}</p>
                            <div>
                                <div class="meta-row" style="margin-bottom: 20px;">
                                    <span class="product-price">$${p.price.toFixed(2)}</span>
                                    <span class="stock-badge">${p.stock} In Stock</span>
                                </div>
                                <a href="/product.html?id=${p.id}" class="view-btn">View Details →</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load products", err);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
