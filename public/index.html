<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Products</title>
    <style>
        :root {
            --bg-color: #030005;
            --card-bg: linear-gradient(145deg, rgba(22, 6, 35, 0.75), rgba(10, 2, 18, 0.85));
            --accent-purple: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.5);
            --text-main: #ffffff;
            --text-muted: #d0a5e8;
            --border-color: rgba(255, 0, 127, 0.35);
            --border-hover: rgba(255, 0, 127, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
        }

        /* Rich Galaxy Background with Spiral Nebula */
        .bg-nebula {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: 
                radial-gradient(circle at 75% 30%, rgba(180, 40, 140, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 20% 70%, rgba(90, 20, 120, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(40, 5, 60, 0.8) 0%, #030005 90%),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            background-blend-mode: screen;
            opacity: 0.85;
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(rgba(255, 0, 127, 0.7) 1.5px, transparent 1.5px);
            background-size: 150px 150px, 90px 90px;
            background-position: 0 0, 45px 45px;
            opacity: 0.35;
        }

        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
        }

        .cursor {
            position: fixed; top: 0; left: 0; font-size: 20px;
            pointer-events: none; transform: translate(-50%, -50%);
            text-shadow: 0 0 10px var(--accent-purple), 0 0 20px rgba(255, 0, 127, 0.8);
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor.hovered { transform: translate(-50%, -50%) scale(1.5); }

        .hearts-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 3; overflow: hidden; 
        }
        .heart { 
            position: absolute; 
            font-size: 22px; 
            animation: floatUp linear infinite; 
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.9);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        header, .main-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 60px; border-bottom: 1px solid var(--border-color); 
            background: rgba(10, 2, 18, 0.4); backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.4rem; letter-spacing: 1.2px; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 10px var(--accent-purple)); }

        .main-layout {
            max-width: 1300px; margin: 40px auto; padding: 0 30px; flex: 1; width: 100%;
        }

        .page-title {
            font-size: 2.3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,0,127,0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 35px;
            justify-content: center;
        }

        .product-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 127, 0.05);
        }
        
        .product-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-6px);
            box-shadow: 0 20px 50px var(--accent-glow), inset 0 0 30px rgba(255, 0, 127, 0.15);
        }

        .product-title { 
            padding: 22px; 
            font-size: 1.5rem; 
            font-weight: 800; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.12), transparent);
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(255,0,127,0.4);
        }

        /* Product Icon Showcase Area */
        .product-icon-container {
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            position: relative;
        }
        .product-icon-container img {
            max-height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.8));
            animation: pulseIcon 3s ease-in-out infinite alternate;
        }
        @keyframes pulseIcon {
            0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.6)); }
            100% { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(255, 0, 127, 1)); }
        }

        .product-body { 
            padding: 25px 30px 30px 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            flex-grow: 1; 
            justify-content: space-between; 
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            text-align: center;
        }

        .meta-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px dashed var(--border-color);
            padding-top: 18px;
        }

        .product-price { 
            font-weight: 900; 
            font-size: 1.7rem; 
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .stock-badge {
            font-size: 0.85rem;
            color: #ff3399;
            background: rgba(255, 0, 127, 0.18);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.4);
            font-weight: 700;
        }

        .view-btn {
            display: block; 
            width: 100%; 
            text-align: center; 
            background: linear-gradient(135deg, var(--accent-purple), #b30059);
            color: #fff; 
            padding: 14px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
        }

        .view-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        footer {
            border-top: 1px solid var(--border-color); 
            padding: 25px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 2, 18, 0.4); backdrop-filter: blur(10px);
            font-size: 0.85rem; color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-nebula"></div>
    <div class="bg-particles"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor">💖</div>
    <div class="hearts-container" id="heartsContainer"></div>

    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
        </a>
    </header>

    <div class="main-layout">
        <h1 class="page-title">Explore Products</h1>
        <div class="products-grid" id="productsGrid">
            <!-- Dynamic products load here -->
        </div>
    </div>

    <footer>
        <div>TVM</div>
        <div>Copyright © 2024 TVM Nametag - corporation.</div>
    </footer>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💜', '✨', '🩷'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = duration + 's';
            
            const size = Math.random() * 16 + 16;
            heart.style.fontSize = size + 'px';
            heart.style.opacity = Math.random() * 0.4 + 0.6;

            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 280);

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.add('hovered');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.remove('hovered');
            }
        });

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-title">${p.name}</div>
                        <div class="product-icon-container">
                            <img src="${p.image || '/logo.png'}" alt="${p.name}">
                        </div>
                        <div class="product-body">
                            <p class="product-desc">${p.description}</p>
                            <div>
                                <div class="meta-row" style="margin-bottom: 18px;">
                                    <span class="product-price">$${p.price.toFixed(2)}</span>
                                    <span class="stock-badge">${p.stock} In Stock</span>
                                </div>
                                <a href="/product.html?id=${p.id}" class="view-btn">View Details → ✨</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load products", err);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
