<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TVM Store - Order Confirmed</title>
    <style>
        :root {
            --bg-color: #0b020d;
            --card-bg: #18051e;
            --accent-purple: #ff007f;
            --text-main: #ffffff;
            --text-muted: #b892c9;
            --border-color: #3b0e46;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.2);
        }
        h1 { color: var(--accent-purple); margin-bottom: 15px; }
        p { color: var(--text-muted); margin-bottom: 25px; line-height: 1.5; }
        a {
            display: inline-block;
            background: var(--accent-purple);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <h1>Payment Successful! 🎉</h1>
        <p>Thank you for your purchase from TVM Store. Your order has been successfully processed and your license/item is on its way.</p>
        <a href="/">Return to Store</a>
    </div>
</body>
</html>
