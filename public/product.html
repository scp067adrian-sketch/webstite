<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Product Details</title>
    <style>
        :root {
            --bg-color: #030005;
            --card-bg: linear-gradient(145deg, rgba(30, 8, 45, 0.85), rgba(15, 3, 24, 0.9));
            --accent-purple: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.6);
            --text-main: #ffffff;
            --text-muted: #d0a5e8;
            --border-color: rgba(255, 0, 127, 0.4);
            --border-hover: rgba(255, 0, 127, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
            perspective: 1200px;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Original Nebula & Particle Background */
        .bg-nebula {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; pointer-events: none; z-index: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 127, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.32) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(75, 0, 130, 0.28) 0%, transparent 70%),
                linear-gradient(135deg, #05000a 0%, #1a0324 50%, #030005 100%);
            animation: nebulaShift 12s ease-in-out infinite alternate;
        }

        @keyframes nebulaShift {
            0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); filter: hue-rotate(25deg); }
            100% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(rgba(255, 0, 127, 0.6) 1.5px, transparent 1.5px);
            background-size: 120px 120px, 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.3;
        }

        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.18) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
        }
        .cursor {
            position: fixed; top: 0; left: 0; font-size: 22px;
            pointer-events: none; transform: translate(-50%, -50%);
            text-shadow: 0 0 12px var(--accent-purple), 0 0 25px rgba(255, 0, 127, 0.9);
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor.hovered { transform: translate(-50%, -50%) scale(1.6); }

        .hearts-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 3; overflow: hidden; 
        }
        .heart { 
            position: absolute; 
            font-size: 24px; 
            animation: floatUp linear infinite; 
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.9), 0 0 30px rgba(255, 0, 127, 0.5);
            filter: drop-shadow(0 5px 12px rgba(0,0,0,0.7));
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.7) rotate(0deg); opacity: 0; }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; }
            100% { transform: translateY(-12vh) scale(1.4) rotate(360deg); opacity: 0; }
        }

        header, .product-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 25px 60px; border-bottom: 1px solid var(--border-color); 
            background: rgba(12, 1, 20, 0.25); backdrop-filter: blur(12px);
        }
        .logo-area { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 1.5rem; letter-spacing: 1.5px; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 12px var(--accent-purple)); }

        .product-layout {
            max-width: 1400px; margin: 50px auto; padding: 0 40px; flex: 1; width: 100%;
            display: grid; grid-template-columns: 320px 1fr; gap: 40px; align-items: start;
        }

        .sidebar-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 0, 127, 0.08);
        }

        .filter-group { margin-bottom: 22px; }
        .filter-group label { display: block; font-size: 0.95rem; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 14px; background: rgba(5, 0, 8, 0.7); border: 1px solid var(--border-color);
            border-radius: 12px; color: #fff; font-size: 1rem; outline: none;
        }

        .apply-btn {
            display: block; width: 100%; text-align: center; background: #fff; color: #000; padding: 14px;
            border-radius: 12px; font-weight: 900; border: none; text-decoration: none; margin-bottom: 15px;
            transition: all 0.2s ease;
        }
        .apply-btn:hover { background: var(--text-muted); }

        .reset-btn {
            display: block; width: 100%; text-align: center; background: transparent; color: var(--text-muted); padding: 12px;
            border-radius: 12px; font-weight: 800; border: 1px solid var(--border-color); text-decoration: none;
            transition: all 0.2s ease;
        }
        .reset-btn:hover { border-color: var(--border-hover); color: #fff; }

        .product-main-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 45px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 0, 127, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-title {
            font-size: 2.2rem; font-weight: 900; text-align: center; margin-bottom: 35px;
            width: 100%; border-bottom: 2px solid var(--border-color); padding-bottom: 24px;
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.15), rgba(255, 0, 127, 0.03));
            text-shadow: 0 0 15px rgba(255,0,127,0.5);
            border-radius: 12px 12px 0 0;
        }

        .product-image-container {
            width: 100%; display: flex; justify-content: center; align-items: center;
            margin-bottom: 35px; padding: 30px; 
            background: radial-gradient(circle, rgba(255,0,127,0.12) 0%, rgba(5,0,8,0.4) 70%); 
            border-radius: 16px; border: 1px solid var(--border-color);
        }
        .product-image-container img { 
            max-height: 140px; object-fit: contain; 
            filter: drop-shadow(0 0 20px var(--accent-purple));
            animation: floatIcon 3s ease-in-out infinite alternate;
        }
        @keyframes floatIcon {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.05); }
        }

        .product-desc {
            color: var(--text-muted); font-size: 1.15rem; line-height: 1.7; text-align: left; width: 100%;
            margin-bottom: 35px; border-bottom: 1px dashed var(--border-color); padding-bottom: 30px;
        }

        .meta-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 30px;
        }

        .product-price { font-weight: 900; font-size: 2.4rem; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.6); }

        .stock-badge {
            font-size: 1rem; color: #ff3399; background: rgba(255, 0, 127, 0.22);
            padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255, 0, 127, 0.6); 
            font-weight: 800; box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .buy-btn {
            display: block; width: 100%; text-align: center; 
            background: linear-gradient(135deg, var(--accent-purple), #b30059);
            color: #fff; padding: 18px; border-radius: 12px; text-decoration: none; 
            font-weight: 900; font-size: 1.25srem;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5); transition: all 0.2s ease; 
            border: 1px solid rgba(255,255,255,0.2); cursor: none;
        }
        .buy-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 8px 30px rgba(255, 0, 127, 0.8);
            transform: scale(1.02);
        }

        .back-link {
            color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 1rem; margin-top: 25px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px var(--accent-purple); }

        footer {
            border-top: 1px solid var(--border-color); 
            padding: 30px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(12, 1, 20, 0.25); backdrop-filter: blur(12px);
            font-size: 0.85rem; color: var(--text-muted);
        }

        @media(max-width: 900px) {
            .product-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-nebula"></div>
    <div class="bg-particles"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor">💖</div>
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="page-wrapper" id="pageWrapper">
        <header>
            <a href="/" class="logo-area">
                <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
            </a>
        </header>

        <div class="product-layout">
            <div class="sidebar-card">
                <div class="filter-group">
                    <label>Categories</label>
                    <select><option>All Categories</option></select>
                </div>
                <div class="filter-group">
                    <label>Keyword</label>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="Min">
                        <input type="text" placeholder="Max">
                    </div>
                </div>
                <button class="apply-btn">Apply →</button>
                <a href="#" class="reset-btn">Reset ↺</a>
            </div>

            <div class="product-main-card">
                <div class="product-title" id="prodName">Loading Product...</div>
                <div class="product-image-container">
                    <img id="prodImage" src="/logo.png" alt="Product Image">
                </div>
                <p class="product-desc" id="prodDesc">Please wait while we fetch the product details.</p>
                <div class="meta-row">
                    <span class="product-price" id="prodPrice">$0.00</span>
                    <span class="stock-badge" id="prodStock">0 In Stock</span>
                </div>
                <button class="buy-btn" id="buyBtn">Buy Now → ✨</button>
                <a href="/" class="back-link">← Back to Products</a>
            </div>
        </div>

        <footer>
            <div>TVM</div>
            <div>Copyright © TVM 2026</div>
        </footer>
    </div>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        const pageWrapper = document.getElementById('pageWrapper');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;

            const xVal = (e.clientX / window.innerWidth - 0.5) * 12; 
            const yVal = (e.clientY / window.innerHeight - 0.5) * -12; 
            pageWrapper.style.transform = `rotateX(${yVal}deg) rotateY(${xVal}deg)`;
        });

        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💜', '✨', '🩷'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = duration + 's';
            
            const size = Math.random() * 18 + 18;
            heart.style.fontSize = size + 'px';
            heart.style.opacity = Math.random() * 0.4 + 0.6;

            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 250);

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.add('hovered');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.remove('hovered');
            }
        });

        let currentProductId = 1;

        async function fetchProductDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id') || 1;
                currentProductId = productId;
                
                const res = await fetch('/api/products');
                const products = await res.json();
                
                const product = products.find(p => p.id == productId) || products[0];

                if (product) {
                    document.getElementById('prodName').textContent = product.name;
                    document.getElementById('prodDesc').textContent = product.description;
                    document.getElementById('prodPrice').textContent = `$${product.price.toFixed(2)}`;
                    document.getElementById('prodStock').textContent = `${product.stock} In Stock`;
                    if (product.image) {
                        document.getElementById('prodImage').src = product.image;
                    }
                }
            } catch (err) {
                console.error("Could not load product details", err);
            }
        }

        // Direct redirection to the server-side Stripe buy route
        document.getElementById('buyBtn').addEventListener('click', () => {
            window.location.href = `/buy/${currentProductId}`;
        });

        fetchProductDetails();
    </script>
</body>
</html>v
