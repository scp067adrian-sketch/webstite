<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Product Details</title>
    <style>
        :root {
            --bg-color: #0b020d;
            --sidebar-bg: #130417;
            --card-bg: #18051e;
            --accent-purple: #ff007f;
            --accent-purple-hover: #ff3399;
            --text-main: #ffffff;
            --text-muted: #b892c9;
            --border-color: #3b0e46;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
        }

        /* Mouse Tracking Glow & Cursor */
        .mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.12) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .cursor {
            position: fixed;
            top: 0; left: 0;
            width: 14px; height: 14px;
            background-color: var(--accent-purple);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--accent-purple);
            transition: width 0.2s, height: 0.2s;
            z-index: 9999;
        }
        .cursor.hovered { width: 28px; height: 28px; background-color: rgba(255, 0, 127, 0.3); border: 2px solid var(--accent-purple); }

        /* Floating Hearts */
        .hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .heart { position: absolute; color: rgba(255, 0, 127, 0.15); font-size: 18px; animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        header, .main-layout, footer { position: relative; z-index: 2; }

        /* Header matching front page */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            border-bottom: 1px solid var(--border-color); 
            background: rgba(11, 2, 13, 0.9);
            backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 5px var(--accent-purple)); }

        /* Main Layout */
        .main-layout {
            max-width: 1300px;
            margin: 40px auto 60px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 40px;
            flex: 1;
            width: 100%;
        }

        /* Left Sidebar Controls */
        .sidebar {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            height: fit-content;
        }
        .filter-group { margin-bottom: 25px; }
        .filter-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; color: var(--text-main); }
        
        .filter-select, .filter-input {
            width: 100%;
            background-color: #0b020d;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        .price-inputs { display: flex; gap: 10px; align-items: center; }
        .price-inputs input { width: 50%; }

        .btn-apply {
            width: 100%;
            background-color: #ffffff;
            color: #000;
            font-weight: 700;
            border: none;
            padding: 11px;
            border-radius: 6px;
            cursor: none;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .btn-apply:hover { background-color: var(--text-muted); }

        .btn-reset {
            width: 100%;
            background-color: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: none;
        }
        .btn-reset:hover { color: #fff; border-color: var(--accent-purple); }

        /* Product Details 3D Card Display */
        .product-display-container {
            display: flex;
            justify-content: center;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.1s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.2);
        }

        .card-header-title {
            padding: 22px;
            text-align: center;
            font-weight: 800;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(24, 5, 30, 0.5);
            transform: translateZ(20px);
        }

        .card-image-box {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(59, 14, 70, 0.3) 0%, transparent 80%);
            transform: translateZ(35px);
        }
        .card-product-logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.4));
        }

        .card-body-info {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(11, 2, 13, 0.6);
            transform: translateZ(20px);
            flex-grow: 1;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .price-stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .product-price { font-weight: 800; color: var(--text-main); font-size: 1.3rem; }
        .product-stock { color: var(--text-muted); font-size: 0.9rem; }

        .buy-now-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-purple), #d9006c);
            color: var(--text-main);
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.3);
            margin-top: 10px;
            cursor: none;
        }
        .buy-now-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.5);
            transform: scale(1.01);
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            text-align: center;
        }
        .back-link:hover { color: var(--text-main); }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 2, 13, 0.9);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor"></div>
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Header -->
    <header>
        <a href="/" class="logo-area">
            <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
        </a>
    </header>

    <!-- Main Layout Content -->
    <div class="main-layout">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
            <div class="filter-group">
                <label>Categories</label>
                <select class="filter-select">
                    <option>All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Keyword</label>
                <input type="text" id="keyword-input" class="filter-input" placeholder="Search...">
            </div>
            <div class="filter-group">
                <label>Price Range</label>
                <div class="price-inputs">
                    <input type="text" class="filter-input" placeholder="Min">
                    <input type="text" class="filter-input" placeholder="Max">
                </div>
            </div>
            <button class="btn-apply">Apply →</button>
            <button class="btn-reset">Reset ↺</button>
        </aside>

        <!-- Product Details Card Display -->
        <div class="product-display-container">
            <div class="product-card" id="productCard">
                <div class="card-header-title" id="product-name">Loading product...</div>
                <div class="card-image-box">
                    <img src="/logo.png" alt="Product Logo" class="card-product-logo">
                </div>
                <div class="card-body-info">
                    <p class="product-desc" id="product-desc"></p>
                    <div class="price-stock-row">
                        <span class="product-price" id="product-price"></span>
                        <span class="product-stock" id="product-stock"></span>
                    </div>
                    <button id="buy-btn" class="buy-now-btn" onclick="handleBuyNow()">Buy Now →</button>
                    <a href="/" class="back-link">← Back to Products</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div>TVM</div>
        <div>Copyright © TVM 2026</div>
    </footer>

    <script>
        // Custom Cursor & Glow tracking
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');

        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.add('hovered');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'BUTTON') {
                cursor.classList.remove('hovered');
            }
        });

        // Floating Hearts Generator
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💜', '✨'];
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 6 + 4;
            heart.style.animationDuration = duration + 's';
            heart.style.fontSize = (Math.random() * 12 + 12) + 'px';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 450);

        // 3D Tilt Effect on the Product Card
        const card = document.getElementById('productCard');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = -((y - centerY) / centerY) * 10;
            const rotateY = ((x - centerX) / centerX) * 10;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });

        // Load specific product based on URL ID query
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id') || 1;
        let currentProduct = null;

        async function loadProductDetails() {
            try {
                const res = await fetch(`/api/products/${productId}`);
                if (!res.ok) throw new Error("Product not found");
                currentProduct = await res.json();

                document.getElementById('product-name').textContent = currentProduct.name;
                document.getElementById('product-desc').textContent = currentProduct.description;
                document.getElementById('product-price').textContent = `$${currentProduct.price.toFixed(2)}`;
                document.getElementById('product-stock').textContent = `${currentProduct.stock} In Stock`;
            } catch (err) {
                document.getElementById('product-name').textContent = "Product Not Found";
                document.getElementById('product-desc').textContent = "The item you requested does not exist.";
                document.getElementById('buy-btn').style.display = 'none';
            }
        }

        // Stripe Redirect Handler
        function handleBuyNow() {
            if (currentProduct) {
                window.location.href = `/buy/${currentProduct.id}`;
            }
        }

        // Keyword Search Apply Button Logic
        document.querySelector('.btn-apply').addEventListener('click', () => {
            const keyword = document.getElementById('keyword-input').value;
            if (keyword.trim() !== '') {
                window.location.href = `/?search=${encodeURIComponent(keyword)}`;
            }
        });

        loadProductDetails();
    </script>
</body>
</html>
