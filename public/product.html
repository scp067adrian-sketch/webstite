<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVM Store - Product Details</title>
    <style>
        :root {
            --bg-color: #030005;
            --card-bg: rgba(22, 5, 32, 0.75);
            --accent-purple: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.4);
            --text-main: #ffffff;
            --text-muted: #d0a5e8;
            --border-color: rgba(255, 0, 127, 0.35);
            --border-hover: rgba(255, 0, 127, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: none; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            position: relative;
            perspective: 1200px;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .bg-nebula {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: 
                radial-gradient(circle at 75% 30%, rgba(180, 40, 140, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 20% 70%, rgba(90, 20, 120, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(40, 5, 60, 0.8) 0%, #030005 90%),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            background-blend-mode: screen;
            opacity: 0.85;
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(rgba(255, 0, 127, 0.7) 1.5px, transparent 1.5px);
            background-size: 150px 150px, 90px 90px;
            background-position: 0 0, 45px 45px;
            opacity: 0.35;
        }

        .mouse-glow {
            position: fixed; top: 0; left: 0; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
        }
        .cursor {
            position: fixed; top: 0; left: 0; font-size: 20px;
            pointer-events: none; transform: translate(-50%, -50%);
            text-shadow: 0 0 10px var(--accent-purple), 0 0 20px rgba(255, 0, 127, 0.8);
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor.hovered { transform: translate(-50%, -50%) scale(1.5); }

        .hearts-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 3; overflow: hidden; 
        }
        .heart { 
            position: absolute; 
            font-size: 22px; 
            animation: floatUp linear infinite; 
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.9);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        header, .product-layout, footer { position: relative; z-index: 2; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 60px; border-bottom: 1px solid var(--border-color); 
            background: rgba(10, 2, 18, 0.4); backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.4rem; letter-spacing: 1.2px; color: var(--text-main); text-decoration: none; }
        .logo-icon { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 10px var(--accent-purple)); }

        .product-layout {
            max-width: 1300px; margin: 40px auto; padding: 0 30px; flex: 1; width: 100%;
            display: grid; grid-template-columns: 320px 1fr; gap: 40px; align-items: start;
        }

        .sidebar-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
        }

        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 12px; background: rgba(5, 0, 8, 0.6); border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none;
        }

        .apply-btn {
            display: block; width: 100%; text-align: center; background: #fff; color: #000; padding: 12px;
            border-radius: 10px; font-weight: 800; border: none; text-decoration: none; margin-bottom: 12px;
        }
        .reset-btn {
            display: block; width: 100%; text-align: center; background: transparent; color: var(--text-muted); padding: 10px;
            border-radius: 10px; font-weight: 700; border: 1px solid var(--border-color); text-decoration: none;
        }

        .product-main-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 40px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-title {
            font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 30px;
            width: 100%; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;
        }

        .product-image-container {
            width: 100%; display: flex; justify-content: center; align-items: center;
            margin-bottom: 30px; padding: 20px; background: rgba(5, 0, 8, 0.3); border-radius: 12px;
            border: 1px solid rgba(255, 0, 127, 0.15);
        }
        .product-image-container img { max-height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px var(--accent-purple)); }

        .product-desc {
            color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; text-align: left; width: 100%;
            margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 25px;
        }

        .meta-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 25px;
        }

        .product-price { font-weight: 900; font-size: 2.2rem; color: #fff; }

        .stock-badge {
            font-size: 0.95rem; color: var(--accent-purple); background: rgba(255, 0, 127, 0.18);
            padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 0, 127, 0.5); font-weight: 700;
        }

        .buy-btn {
            display: block; width: 100%; text-align: center; background: linear-gradient(135deg, var(--accent-purple), #b30059);
            color: #fff; padding: 18px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 1.2rem;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.45); transition: all 0.2s ease; border: none; cursor: none;
        }
        .buy-btn:hover { filter: brightness(1.15); box-shadow: 0 8px 30px rgba(255, 0, 127, 0.7); }

        .back-link {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; margin-top: 20px;
        }
        .back-link:hover { color: #fff; }

        footer {
            border-top: 1px solid var(--border-color); 
            padding: 25px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 2, 18, 0.4); backdrop-filter: blur(10px);
            font-size: 0.85rem; color: var(--text-muted);
        }

        @media(max-width: 900px) {
            .product-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-nebula"></div>
    <div class="bg-particles"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="cursor" id="customCursor">💖</div>
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="page-wrapper" id="pageWrapper">
        <header>
            <a href="/" class="logo-area">
                <img src="/logo.png" alt="TVM Logo" class="logo-icon"> TVM
            </a>
        </header>

        <div class="product-layout">
            <div class="sidebar-card">
                <div class="filter-group">
                    <label>Categories</label>
                    <select><option>All Categories</option></select>
                </div>
                <div class="filter-group">
                    <label>Keyword</label>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="Min">
                        <input type="text" placeholder="Max">
                    </div>
                </div>
                <button class="apply-btn">Apply →</button>
                <a href="#" class="reset-btn">Reset ↺</a>
            </div>

            <div class="product-main-card">
                <div class="product-title" id="prodName">Loading Product...</div>
                <div class="product-image-container">
                    <img id="prodImage" src="/logo.png" alt="Product Image">
                </div>
                <p class="product-desc" id="prodDesc">Please wait while we fetch the product details.</p>
                <div class="meta-row">
                    <span class="product-price" id="prodPrice">$0.00</span>
                    <span class="stock-badge" id="prodStock">0 In Stock</span>
                </div>
                <button class="buy-btn" id="buyBtn">Buy Now →</button>
                <a href="/" class="back-link">← Back to Products</a>
            </div>
        </div>

        <footer>
            <div>TVM</div>
            <div>Copyright © 2024 TVM Nametag - corporation.</div>
        </footer>
    </div>

    <script>
        const cursor = document.getElementById('customCursor');
        const glow = document.getElementById('mouseGlow');
        const pageWrapper = document.getElementById('pageWrapper');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;

            const xVal = (e.clientX / window.innerWidth - 0.5) * 10; 
            const yVal = (e.clientY / window.innerHeight - 0.5) * -10; 
            pageWrapper.style.transform = `rotateX(${yVal}deg) rotateY(${xVal}deg)`;
        });

        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💗', '💜', '✨', '🩷'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = duration + 's';
            
            const size = Math.random() * 16 + 16;
            heart.style.fontSize = size + 'px';
            heart.style.opacity = Math.random() * 0.4 + 0.6;

            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 280);

        let currentProductId = 1;

        async function fetchProductDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id') || 1;
                currentProductId = productId;
                
                const res = await fetch('/api/products');
                const products = await res.json();
                
                const product = products.find(p => p.id == productId) || products[0];

                if (product) {
                    document.getElementById('prodName').textContent = product.name;
                    document.getElementById('prodDesc').textContent = product.description;
                    document.getElementById('prodPrice').textContent = `$${product.price.toFixed(2)}`;
                    document.getElementById('prodStock').textContent = `${product.stock} In Stock`;
                    if (product.image) {
                        document.getElementById('prodImage').src = product.image;
                    }
                }
            } catch (err) {
                console.error("Could not load product details", err);
            }
        }

        // Direct redirection to the server-side Stripe buy route
        document.getElementById('buyBtn').addEventListener('click', () => {
            window.location.href = `/buy/${currentProductId}`;
        });

        fetchProductDetails();
    </script>
</body>
</html>
